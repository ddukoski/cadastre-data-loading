version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cadastre-postgres
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:-cadastre}
      POSTGRES_USER: ${DB_USER:-cadastre_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cadastre_pass_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cadastre_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cadastre-network

volumes:
  postgres_data:
    driver: local

networks:
  cadastre-network:
    driver: bridge
